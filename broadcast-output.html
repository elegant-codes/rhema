<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Rhema Broadcast</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }

    @keyframes alert-marquee {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100%); }
    }

    .alert-overlay {
      position: fixed;
      left: 0;
      right: 0;
      height: 11.11vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      overflow: hidden;
      z-index: 10;
    }

    .alert-overlay-top { top: 0; }
    .alert-overlay-bottom { bottom: 0; }

    .alert-marquee-text {
      color: #fbbf24;
      font-weight: bold;
      font-size: 5.93vh;
      white-space: nowrap;
      animation: alert-marquee linear infinite;
      text-shadow: 0 0.19vh 0.37vh rgba(0, 0, 0, 0.5);
      will-change: transform;
    }
  </style>
</head>
<body>
  <div id="broadcast-root"></div>
  <script type="module" src="/src/broadcast-output.tsx"></script>
</body>
</html>
